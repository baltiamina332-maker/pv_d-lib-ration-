<div class="auth-wrapper" [attr.data-theme]="'light'">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-icon">
                <i class="fa-solid fa-file-word"></i>
            </div>
            <h2 class="auth-title">PV-Delib</h2>
            <p class="auth-subtitle">Connectez-vous pour accéder à votre espace</p>
        </div>
        
        <div class="auth-body">
            <form (ngSubmit)="onSubmit()">
                <div *ngIf="errorMessage" class="alert alert-danger">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>{{ errorMessage }}</span>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Nom d'utilisateur</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-user" style="position: absolute; left: 14px; top: 12px; color: var(--text-muted);"></i>
                        <input type="text" class="form-control" name="username" [(ngModel)]="form.username" required style="padding-left: 40px;" placeholder="Entrez votre identifiant">
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Mot de passe</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-lock" style="position: absolute; left: 14px; top: 12px; color: var(--text-muted);"></i>
                        <input type="password" class="form-control" name="password" [(ngModel)]="form.password" required style="padding-left: 40px;" placeholder="Entrez votre mot de passe">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block btn-lg mt-4">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Se connecter
                </button>
            </form>
            
            <div class="auth-footer">
                Vous n'avez pas de compte ? <a routerLink="/register" class="auth-link">Créer un compte</a>
            </div>
        </div>
    </div>
</div>
