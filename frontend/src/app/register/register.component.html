<div class="auth-wrapper" [attr.data-theme]="'light'">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-icon" style="background: linear-gradient(135deg, #10B981, #059669); box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 class="auth-title">Inscription</h2>
            <p class="auth-subtitle">Créez votre compte PV-Delib</p>
        </div>
        
        <div class="auth-body">
            <form *ngIf="!isSuccessful" (ngSubmit)="onSubmit()">
                <div *ngIf="errorMessage" class="alert alert-danger">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>{{ errorMessage }}</span>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Nom d'utilisateur</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-user" style="position: absolute; left: 14px; top: 12px; color: var(--text-muted);"></i>
                        <input type="text" class="form-control" name="username" [(ngModel)]="form.username" required style="padding-left: 40px;" placeholder="Choisissez un identifiant">
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Mot de passe</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-lock" style="position: absolute; left: 14px; top: 12px; color: var(--text-muted);"></i>
                        <input type="password" class="form-control" name="password" [(ngModel)]="form.password" required style="padding-left: 40px;" placeholder="Choisissez un mot de passe">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-success btn-block btn-lg mt-4">
                    <i class="fa-solid fa-check"></i> S'inscrire
                </button>
            </form>

            <div *ngIf="isSuccessful" class="alert alert-success mt-2 mb-4" style="flex-direction: column; text-align: center; gap: 12px; padding: 24px;">
                <i class="fa-solid fa-circle-check" style="font-size: 40px;"></i>
                <strong>Inscription réussie !</strong>
                <span style="opacity: 0.9;">Votre compte a été créé avec succès et est actuellement en attente d'approbation par un administrateur.</span>
            </div>
            
            <div class="auth-footer">
                Vous avez déjà un compte ? <a routerLink="/login" class="auth-link">Se connecter</a>
            </div>
        </div>
    </div>
</div>
